<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akbar | Links</title>
<style>
:root{--bg:#f4f1fb;--text:#1d1830;--sub:#6b6385;--card:rgba(255,255,255,.65);--border:rgba(120,100,200,.18);--a1:#7c5cff;--a2:#22d3ee;--a3:#ff6bb5;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a14;--text:#f5f3ff;--sub:#9d96b8;--card:rgba(255,255,255,.06);--border:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg:#0b0a14;--text:#f5f3ff;--sub:#9d96b8;--card:rgba(255,255,255,.06);--border:rgba(255,255,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Inter","Segoe UI",Roboto,sans-serif;overflow-x:hidden;padding:env(safe-area-inset-top,0px) 18px env(safe-area-inset-bottom,0px);position:relative}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.55;z-index:0;animation:float 14s ease-in-out infinite}
.b1{width:320px;height:320px;background:var(--a1);top:-80px;left:-100px}
.b2{width:280px;height:280px;background:var(--a2);bottom:-60px;right:-90px;animation-delay:-5s}
.b3{width:200px;height:200px;background:var(--a3);top:45%;left:55%;animation-delay:-9s;opacity:.35}
@keyframes float{50%{transform:translate(30px,-40px) scale(1.1)}}
main{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:56px 0 40px;text-align:center}
.ring{width:108px;height:108px;margin:0 auto 18px;border-radius:50%;padding:3px;background:conic-gradient(var(--a1),var(--a2),var(--a3),var(--a1));animation:spin 8s linear infinite}
.ring div{width:100%;height:100%;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;animation:spin 8s linear infinite reverse;background-image:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0;font-size:30px;letter-spacing:-.5px;font-weight:800}
.bio{margin:8px 0 6px;color:var(--sub);font-size:15px}
.tag{display:inline-block;margin:6px 0 30px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--a2);border:1px solid var(--border);background:var(--card)}
a.link{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 16px;border-radius:18px;margin-bottom:12px;font-weight:600;font-size:16px;opacity:0;transform:translateY(14px);animation:in .5s ease forwards;transition:transform .2s,border-color .2s,box-shadow .2s}
a.link:nth-of-type(1){animation-delay:.1s}a.link:nth-of-type(2){animation-delay:.18s}a.link:nth-of-type(3){animation-delay:.26s}a.link:nth-of-type(4){animation-delay:.34s}
@keyframes in{to{opacity:1;transform:none}}
a.link:hover{transform:translateY(-2px);border-color:var(--a1);box-shadow:0 10px 30px -10px var(--a1)}
a.link:active{transform:scale(.97)}
.ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ic svg{width:20px;height:20px;fill:currentColor}
.t{background:linear-gradient(135deg,#2aabee,#229ed9)}
.i{background:linear-gradient(135deg,#feda75,#d62976 55%,#4f5bd5)}
.g{background:linear-gradient(135deg,#444,#111)}
.p{background:linear-gradient(135deg,var(--a1),var(--a2))}
.arrow{margin-left:auto;opacity:.4;font-size:18px}
footer{margin-top:28px;font-size:12px;color:var(--sub)}
</style>
</head>
